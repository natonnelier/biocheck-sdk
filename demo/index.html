<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biocheck SDK — Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #eee; margin: 0; padding: 1.5rem 16px; display: flex; flex-direction: column; align-items: center; gap: 1rem; min-height: 100vh; }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 0; }
    #sdk { width: 100%; max-width: 640px; }
    button { padding: 0.6rem 1.4rem; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; background: #2563eb; color: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #result { font-size: 1.2rem; font-weight: 700; min-height: 1.5em; text-align: center; }
    .accepted { color: #22c55e; }
    .rejected { color: #ef4444; }
    .error { color: #f59e0b; }
  </style>
</head>
<body>
  <h1>Biocheck SDK — Demo</h1>
  <button id="start">Verificar identidad</button>
  <div id="sdk"></div>
  <div id="result"></div>

  <script type="module">
    import { verify, BiocheckError } from "../src/index.ts";

    const start = document.getElementById("start");
    const container = document.getElementById("sdk");
    const resultEl = document.getElementById("result");

    start.addEventListener("click", async () => {
      start.disabled = true;
      resultEl.textContent = "";
      resultEl.className = "";
      try {
        const { accepted, score } = await verify(container, { modelsBaseUrl: "/models" });
        const s = score !== undefined ? ` (score: ${score.toFixed(3)})` : "";
        resultEl.textContent = (accepted ? "Verificado ✓" : "Rechazado ✗") + s;
        resultEl.className = accepted ? "accepted" : "rejected";
      } catch (e) {
        resultEl.textContent = e instanceof BiocheckError ? `Error: ${e.code}` : `Error: ${e}`;
        resultEl.className = "error";
        console.error(e);
      } finally {
        start.disabled = false;
      }
    });
  </script>
</body>
</html>
